<nav class="navbar">
  <a class="navbar-brand" routerLink="/">
    <span class="logo-text"><span class="logo-meet">Meet</span><span class="logo-pro">Pro</span></span>
  </a>

  <div class="navbar-acciones">
  <button
    type="button"
    class="btn-idioma"
    translate="no"
    (click)="idioma.alternar()"
    [attr.aria-label]="idioma.idioma() === 'es' ? 'Switch the site to English' : 'Cambiar el sitio a español'"
    [attr.title]="idioma.idioma() === 'es' ? 'Switch the site to English' : 'Cambiar el sitio a español'"
  >
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9" />
      <path d="M3 12h18" />
      <path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
    </svg>
    {{ idioma.idioma() === 'es' ? 'EN' : 'ES' }}
  </button>

  @if (usuario(); as u) {
    <div class="navbar-sesion">
      <a class="navbar-campana" [class.navbar-campana--alerta]="noLeidas() > 0" routerLink="/notificaciones" aria-label="Notificaciones" title="Notificaciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
          <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
        </svg>
        @if (noLeidas() > 0) {
          <span class="navbar-campana-badge">{{ noLeidas() > 9 ? '9+' : noLeidas() }}</span>
        }
      </a>
      <span class="navbar-usuario">{{ u.name }} {{ u.lastname }}</span>
      <button type="button" class="btn-cerrar-sesion" (click)="cerrarSesion()">
        Cerrar sesión
      </button>
    </div>
  }
  </div>
</nav>
