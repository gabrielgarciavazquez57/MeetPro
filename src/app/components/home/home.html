<section class="fondo-home">
  <div class="contenido-home">
    <h1 class="titulo-home">Bienvenido a MeetPro</h1>
    <p class="subtitulo-home">Conectá con profesionales y gestioná tus turnos en un solo lugar.</p>

    <div class="home-acciones">
      @if (usuario()) {
        <span class="btn btn-grande btn-desactivado" aria-disabled="true" title="Ya iniciaste sesión">
          Iniciar sesión
        </span>
        <span class="btn btn-grande btn-desactivado" aria-disabled="true" title="Ya iniciaste sesión">
          Registrar Usuario
        </span>
      } @else {
        <a routerLink="/login" class="btn btn-grande">Iniciar sesión</a>
        <a routerLink="/CreateUser" class="btn btn-grande">Registrar Usuario</a>
      }
      <a routerLink="/profesionales-lista" class="btn btn-grande">Ver profesionales</a>
    </div>
  </div>
</section>
